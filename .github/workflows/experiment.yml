name: Experimento OIDC
on:
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r experiments/zitadel/requirements-test.txt
      - run: python -m pytest experiments/tests -q
      - run: docker compose -f experiments/zitadel/docker-compose.yml config --no-interpolate --quiet

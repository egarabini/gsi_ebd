[project]
name = "gsi-ebd"
version = "0.1.0"
description = "App de Estudos Biblicos Dirigidos - Siga a Biblia"
requires-python = ">=3.11"
dependencies = [
    "reflex>=0.4.0",
    "sqlmodel>=0.0.22",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.1",
    "passlib>=1.7.4",
    "bcrypt>=4.1.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "ollama>=0.3.0",
    "httpx>=0.27.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

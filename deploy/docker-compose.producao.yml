# Didasko — producao (VPS Contabo)
#
# Sobe tres servicos:
#   traefik  -> proxy reverso + HTTPS automatico (Let's Encrypt) para didasko.app.br
#   app      -> a aplicacao Reflex (interna, sem porta exposta no host)
#   postgres -> banco, com volume persistente
#
# Uso na VPS (dentro de ~/didasko):
#   cp deploy/.env.producao.example .env      # e preencha os valores
#   docker compose --env-file .env -f deploy/docker-compose.producao.yml up -d --build
#
# IMPORTANTE: o Docker Compose procura o .env NA PASTA DESTE ARQUIVO (deploy/),
# nao na raiz do projeto. Como o .env fica na raiz, o `--env-file .env` e
# OBRIGATORIO. Sem ele, ${POSTGRES_PASSWORD} e ${ACME_EMAIL} chegam VAZIOS e o
# Docker apenas emite um aviso (WARN), subindo o banco com senha em branco.
#
# Alternativa: em vez de --env-file, copie o .env para deploy/.env.
#
# Requisitos: DNS de didasko.app.br apontando para o IP desta VPS, e as portas
# 80 e 443 liberadas.

services:
  traefik:
    image: traefik:latest
    container_name: didasko_traefik
    restart: unless-stopped
    # CORRECAO (fonte: forum oficial do Traefik, "make sure to use Traefik latest"):
    # o cliente Docker embutido nas versoes antigas negocia a API 1.24, e o Docker
    # 29.x passou a RECUSAR clientes abaixo de 1.40:
    #   client version 1.24 is too old. Minimum supported API version is 1.40
    # Efeito: o Traefik nao descobre NENHUM container — nao le as labels, nao monta
    # o router, e o dominio nao e servido (HTTP 443 fechado, sem certificado).
    # A porta 80 responde 301 porque o entrypoint redireciona ANTES de precisar do
    # router, o que mascara o problema.
    # Tentamos v3.1 -> v3.3 e DOCKER_API_VERSION=1.44: NAO resolveu. A correcao e
    # a versao mais recente. Fixar em :latest e deliberado — o problema esta
    # justamente em ficar preso a uma versao antiga.
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # redireciona todo HTTP para HTTPS
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # Let's Encrypt
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - didasko

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: didasko_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
      ollama:
        condition: service_started
    environment:
      # o app fala com o banco pelo nome do servico, na rede interna
      # +psycopg2 explicito: sem o driver na URL, o SQLAlchemy escolhe sozinho e pode
# tentar o psycopg (v3) que nao esta instalado. Explicitar elimina a duvida.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_BASE_URL: https://didasko.app.br
      SECRET_KEY: ${SECRET_KEY}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Didasko}
      MAX_FAILED_LOGIN_ATTEMPTS: ${MAX_FAILED_LOGIN_ATTEMPTS:-5}
      TOKEN_EXPIRY_HOURS: ${TOKEN_EXPIRY_HOURS:-24}
      INACTIVITY_DAYS: ${INACTIVITY_DAYS:-60}
      # RAG biblico (mesmas chaves que o PASTOR_IA usa)
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      BIBLIA_COLLECTION: biblia_pt_br
      # Arvore de conteudo (planos de estudo). Montada como volume SOMENTE LEITURA
      # em /conteudo. O importador localiza via ESTUDOS_ROOT, porque dentro do
      # container a estrutura de diretorios nao permite a busca por pais.
      ESTUDOS_ROOT: /conteudo/ESTUDOS_BIBLICOS
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
    volumes:
      # Arvore de conteudo dos estudos, montada SOMENTE LEITURA.
      #
      # Origem: clone do repo EVANGELICOS em ~/conteudo (o deploy usa o repo
      # gsi_ebd, que tem apenas o codigo — o conteudo vive no outro repo).
      #
      # :ro e deliberado. O importador apenas LE os planos. E sao ~15 MB de
      # traducao de obra protegida por direitos autorais: nao devem ser
      # embutidos na imagem (evita redistribuicao via registry) nem gravados.
      - ../conteudo/ESTUDOS_BIBLICOS:/conteudo/ESTUDOS_BIBLICOS:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.didasko.rule=Host(`didasko.app.br`) || Host(`www.didasko.app.br`)
      - traefik.http.routers.didasko.entrypoints=websecure
      - traefik.http.routers.didasko.tls.certresolver=le
      - traefik.http.services.didasko.loadbalancer.server.port=3000
    networks:
      - didasko

  postgres:
    image: postgres:16-alpine
    container_name: didasko_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-didasko}
      POSTGRES_USER: ${POSTGRES_USER:-didasko}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-didasko}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - didasko

  # ChromaDB: banco vetorial com o corpus biblico (31 mil versiculos ACF 2007).
  # Serve o texto VERIFICADO para a licao — o modelo nunca inventa Escritura.
  chromadb:
    image: chromadb/chroma:latest
    container_name: didasko_chromadb
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - didasko

  # Ollama: LLM local. NAO e exposto ao mundo (fica so na rede interna).
  # Serve dois papeis: (a) parecer preliminar das respostas abertas para o
  # instrutor confirmar; (b) explicacoes de contexto. A Escritura NAO vem daqui —
  # ela vem do corpus no ChromaDB, para nao haver versiculo inventado.
  ollama:
    image: ollama/ollama:latest
    container_name: didasko_ollama
    restart: unless-stopped
    environment:
      # desliga telemetria e mantem os modelos no volume
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - didasko

volumes:
  pgdata:
  letsencrypt:
  chroma_data:
  ollama_models:

networks:
  didasko:
    driver: bridge

{% extends "base.html" %}{% block conteudo %}<section class="cartao estreito"><p>Use uma senha nova com pelo menos 8 caracteres.</p>{% if usuario.must_change_password %}<p class="aviso">A troca de senha é obrigatória antes de continuar.</p>{% endif %}{% if erro %}<p role="alert" class="erro">{{ erro }}</p>{% endif %}
<form method="post" action="/perfil/alterar-senha"><input type="hidden" name="csrf_token" value="{{ csrf }}"><label>Senha atual<input name="senha_atual" type="password" autocomplete="current-password" required></label><label>Nova senha<input name="nova_senha" type="password" autocomplete="new-password" minlength="8" required></label><label>Confirme a nova senha<input name="confirma_senha" type="password" autocomplete="new-password" required></label><button>Salvar nova senha</button></form></section>{% endblock %}

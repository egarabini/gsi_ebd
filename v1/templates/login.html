{% extends "base.html" %}{% block conteudo %}<section class="cartao estreito"><h2>Acesse sua conta</h2><p>Entre para trabalhar nas obras do seu perfil.</p>{% if erro %}<p role="alert" class="erro">{{ erro }}</p>{% endif %}
<form method="post" action="/login"><input type="hidden" name="csrf_token" value="{{ csrf }}"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Senha<input name="senha" type="password" required autocomplete="current-password"></label><button>Entrar</button></form></section>{% endblock %}

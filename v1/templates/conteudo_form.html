{% macro campos(capitulos, adendos) %}
<section class="editor">
  <h3>Capítulos</h3>
  <div data-grupo="capitulos">
    {% for cap in capitulos %}
    <fieldset>
      <legend>Capítulo</legend>
      <label>Ordem<input name="capitulo_ordem" type="number" value="{{ cap.ordem }}" required></label>
      <label>Título<input name="capitulo_titulo" value="{{ cap.titulo }}"></label>
      <label>Conteúdo Markdown<textarea name="capitulo_texto" rows="8">{{ cap.conteudo_md }}</textarea></label>
    </fieldset>
    {% endfor %}
  </div>
  <button type="button" class="secundario" data-adicionar="capitulos">Adicionar capítulo</button>
  <template data-modelo="capitulos">
    <fieldset>
      <legend>Novo capítulo</legend>
      <label>Ordem<input name="capitulo_ordem" type="number" required></label>
      <label>Título<input name="capitulo_titulo"></label>
      <label>Conteúdo Markdown<textarea name="capitulo_texto" rows="8"></textarea></label>
    </fieldset>
  </template>
  <h3>Adendos da base</h3>
  <div data-grupo="adendos">
    {% for nota in adendos %}
    <fieldset>
      <legend>Adendo</legend>
      <label>Código<input name="adendo_codigo" value="{{ nota.codigo }}" required></label>
      <label>Título<input name="adendo_titulo" value="{{ nota.titulo }}"></label>
      <label>Texto<textarea name="adendo_texto" rows="4">{{ nota.texto }}</textarea></label>
    </fieldset>
    {% endfor %}
  </div>
  <button type="button" class="secundario" data-adicionar="adendos">Adicionar adendo</button>
  <template data-modelo="adendos">
    <fieldset>
      <legend>Novo adendo</legend>
      <label>Código<input name="adendo_codigo" required></label>
      <label>Título<input name="adendo_titulo"></label>
      <label>Texto<textarea name="adendo_texto" rows="4"></textarea></label>
    </fieldset>
  </template>
</section>
{% endmacro %}
